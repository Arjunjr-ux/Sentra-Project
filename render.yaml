# Render blueprint — API web service + static SPA + PostgreSQL (SENTRA_BUILD_SPEC.md §10).
# Connect this repo as a Blueprint in the Render dashboard.

databases:
  - name: sentra-db
    plan: free
    databaseName: sentra
    user: sentra
    region: oregon

services:
  - type: web
    name: sentra-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/v1/schema/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sentra-db
          property: connectionString
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: sentra-api
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: sentra-web
          property: host

  - type: web
    name: sentra-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sentra-api
          property: host
