[project]
name = "sentra-backend"
version = "0.1.0"
description = "Sentra — access-management console API (Django + DRF)"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E402"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "config/*", "manage.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
