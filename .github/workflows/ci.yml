# CI — placeholder scaffold. Filled in fully during Phase 4 (see CLAUDE_CODE_PROMPTS.md).
#
# Planned jobs:
#   backend  — ruff check, black --check, pytest with >=80% coverage gate, pip-audit
#   frontend — eslint, prettier --check, vitest, npm audit
