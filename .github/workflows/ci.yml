name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  placeholder:
    name: scaffold check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm monorepo layout
        run: |
          test -f backend/requirements.txt
          test -f frontend/package.json
          echo "Scaffold present. Real lint/test/coverage jobs land in Phase 4."
